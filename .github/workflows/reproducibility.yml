name: Reproducibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpc-reproducibility:
    name: CPC R1-R5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SET-ANUBIS and reproducibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,selection]"

      - name: Run and validate CPC reproducibility scenarios
        run: >-
          python reproducibility/run_reproducibility.py
          --output-root reproducibility-output

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v7
        with:
          name: setanubis-reproducibility-${{ github.sha }}
          path: reproducibility-output
          if-no-files-found: error
          retention-days: 30
