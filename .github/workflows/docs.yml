name: Docs

on:
  push:
    branches: [main]
    paths:
      - "Docs/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "Docs/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages after building"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Sphinx documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            Docs/requirements.txt
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build Sphinx HTML
        run: sphinx-build -b html Docs/manual/source Docs/manual/build/html
      - name: Upload built docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: setanubis-docs-html
          path: Docs/manual/build/html
      - name: Configure GitHub Pages
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true' ||
          github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true' ||
          github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
        uses: actions/upload-pages-artifact@v5
        with:
          path: Docs/manual/build/html

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true' ||
      github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
