name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release stage"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - testpypi-and-pypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts once
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read and validate release metadata
        id: package-version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text())["project"]
          version = project["version"]
          version_source = (root / "setanubis/SetAnubis/_version.py").read_text()
          source_match = re.search(r'__version__\s*=\s*"([^"]+)"', version_source)
          if not source_match or source_match.group(1) != version:
              raise SystemExit("pyproject.toml and _version.py disagree")
          cff = (root / "CITATION.cff").read_text()
          if f'version: "{version}"' not in cff:
              raise SystemExit("CITATION.cff version does not match")
          if project.get("license") != "GPL-3.0-or-later":
              raise SystemExit("release license must be GPL-3.0-or-later")
          if "license: GPL-3.0-or-later" not in cff:
              raise SystemExit("CITATION.cff license does not match")
          print(f"version={version}")
          PY

      - name: Require a matching tag for final promotion
        if: github.event.inputs.target == 'testpypi-and-pypi'
        env:
          SETANUBIS_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/tags/v${SETANUBIS_VERSION}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run release checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
          python -m compileall -q setanubis/SetAnubis setanubis/setanubis.py setanubis/__init__.py
          python -m ruff check .
          python -m pip_audit
          python -m bandit -q -lll -r setanubis/SetAnubis/core \
            -x setanubis/SetAnubis/core/UFOInterface/SM_NLO,setanubis/SetAnubis/core/BranchingRatio/app,setanubis/SetAnubis/core/DataBase/app,setanubis/SetAnubis/core/Geometry/app,setanubis/SetAnubis/core/MadGraph/app,setanubis/SetAnubis/core/Pythia/app,setanubis/SetAnubis/core/Selection/app
          setanubis-pythia-smoke --out .release-pythia-smoke
          python -m pytest -q setanubis/tests \
            --cov=SetAnubis --cov-config=pyproject.toml \
            --cov-report=term-missing --cov-fail-under=58
          python reproducibility/run_all.py --output-dir .release-reproducibility
          setanubis-docs --strict

      - name: Build sdist and wheel
        run: |
          rm -rf build dist *.egg-info setanubis/*.egg-info
          python -m build
          python -m twine check dist/*
          sha256sum dist/* | tee SHA256SUMS

      - name: Upload immutable distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-dist-${{ steps.package-version.outputs.version }}
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    name: Publish immutable artifacts to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.build.outputs.version }}
          path: release-artifact

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-artifact/dist

  verify-testpypi:
    name: Verify installation from TestPyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.build.outputs.version }}
          path: release-artifact

      - name: Download and verify the TestPyPI wheel
        env:
          SETANUBIS_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -rf testpypi-download
            mkdir testpypi-download
            if python -m pip download --no-deps --no-cache-dir \
              --dest testpypi-download \
              --index-url https://test.pypi.org/simple/ \
              "SetAnubis==${SETANUBIS_VERSION}"; then
              break
            fi
            if [ "$attempt" = "8" ]; then
              echo "TestPyPI package did not become downloadable" >&2
              exit 1
            fi
            sleep 15
          done

          expected_sha=$(awk '/setanubis-.*\.whl$/ {print $1}' release-artifact/SHA256SUMS)
          actual_sha=$(sha256sum testpypi-download/*.whl | awk '{print $1}')
          test -n "$expected_sha"
          test "$actual_sha" = "$expected_sha"

          python -m pip install testpypi-download/*.whl
          python -m pip check

      - name: Smoke test installed package
        env:
          SETANUBIS_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          python - <<'PY'
          import os
          import setanubis

          assert setanubis.__version__ == os.environ["SETANUBIS_VERSION"]
          from setanubis import MadGraphDockerRunner, SelectionPipelineBuilder
          print("SetAnubis", setanubis.__version__)
          print(MadGraphDockerRunner, SelectionPipelineBuilder)
          PY
          setanubis-pythia-smoke --out "$tmpdir/pythia-smoke"

  publish-pypi:
    name: Promote the same artifacts to PyPI
    if: github.event.inputs.target == 'testpypi-and-pypi'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.build.outputs.version }}
          path: release-artifact

      - name: Verify retained checksums
        run: cd release-artifact && sha256sum --check SHA256SUMS

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifact/dist

  github-release:
    name: Create GitHub release from promoted artifacts
    if: github.event.inputs.target == 'testpypi-and-pypi'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.build.outputs.version }}
          path: release-artifact

      - name: Attach distributions to the existing release tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            release-artifact/dist/*
            release-artifact/SHA256SUMS
          generate_release_notes: true
