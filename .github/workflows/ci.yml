name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q setanubis/SetAnubis setanubis/setanubis.py setanubis/__init__.py

      - name: Run Pythia CMND smoke test
        run: setanubis-pythia-smoke --out .ci-pythia-smoke

      - name: Run release lint
        if: matrix.python-version == '3.12'
        run: python -m ruff check .

      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: python -m pytest -q setanubis/tests

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest -q setanubis/tests
          --cov=SetAnubis
          --cov-config=pyproject.toml
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=58

      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit

      - name: Run high-severity security scan
        if: matrix.python-version == '3.12'
        run: >-
          python -m bandit -q -lll -r setanubis/SetAnubis/core
          -x setanubis/SetAnubis/core/UFOInterface/SM_NLO,setanubis/SetAnubis/core/BranchingRatio/app,setanubis/SetAnubis/core/DataBase/app,setanubis/SetAnubis/core/Geometry/app,setanubis/SetAnubis/core/MadGraph/app,setanubis/SetAnubis/core/Pythia/app,setanubis/SetAnubis/core/Selection/app


  packaging:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Test wheel install without source-tree shadowing
        run: |
          tmpdir=$(mktemp -d)
          python -m pip install --force-reinstall dist/*.whl
          cd "$tmpdir"
          python - <<'PY'
          import setanubis
          from setanubis import __version__, asset_path
          assert __version__ == "1.0.0", __version__
          import inspect
          assert "SetAnubisInterface" in dir(setanubis)
          failures = []
          for name in setanubis.__all__:
              if name == "__version__":
                  continue
              try:
                  value = getattr(setanubis, name)
              except Exception as exc:
                  failures.append(f"{name}: {type(exc).__name__}: {exc}")
                  continue
              if not inspect.getdoc(value):
                  failures.append(f"{name}: missing docstring")
          assert not failures, "\n".join(failures)
          print("SetAnubis", __version__)
          print(asset_path("particles", "particleData.json"))
          PY
      - name: Test example banners and machine-readable diagnostics from the wheel
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          SETANUBIS_BANNER=always python -m SetAnubis.examples.Pythia.example_pythia_cmnd > pythia-example.txt
          SETANUBIS_BANNER=always python -m SetAnubis.examples.BranchingRatio.example_BranchingRatioInterface_hnl > branching-ratio-example.txt
          version=$(python -c 'import setanubis; print(setanubis.__version__)')
          test "$(grep -c " SET-ANUBIS ${version}" pythia-example.txt)" = "1"
          test "$(grep -c " SET-ANUBIS ${version}" branching-ratio-example.txt)" = "1"
          set +e
          setanubis-pythia-check --json > pythia-diagnostics.json
          status=$?
          set -e
          test "$status" = "0" -o "$status" = "1"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("pythia-diagnostics.json").read_text())
          assert "python_binding" in report
          PY
      - name: Test optional Dash entry points from the wheel
        run: |
          python -m pip install dash plotly pyhepmc requests python-dotenv python-multipart
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          setanubis-hepmc-explorer --help
          setanubis-db-dashboard --help
          python - <<'PY'
          import json
          from pathlib import Path

          from SetAnubis.HepMCGUI.app import DEFAULT_HEPMC_PATH, run_extraction
          from SetAnubis.SetAnubisDBDashboard.SetAnubisDBDashboard.data import load_payload
          from SetAnubis.SetAnubisDBDashboard.SetAnubisDBDashboard.demo import ensure_demo_workspace

          assert Path(DEFAULT_HEPMC_PATH).is_file()
          result = run_extraction(
              0, DEFAULT_HEPMC_PATH, "9900012", "", "", ["yes"], ["ip"], "standard_hnl"
          )
          selection = json.loads(result[2])
          assert selection["cut_flow"]["nLLP_Final"] == 1

          workspace = ensure_demo_workspace()
          payload = load_payload(str(workspace.database), str(workspace.storage), include_particles=True)
          assert payload["storage"]["events"] == 1
          assert payload["events"][0]["llp_pid"] == 9900012
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: setanubis-dist
          path: dist/*
