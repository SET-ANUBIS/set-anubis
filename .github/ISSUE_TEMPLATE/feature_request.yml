name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What analysis or workflow would this enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, command, workflow, or behavior you would like.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ModelCore/UFO
        - BranchingRatio
        - Pythia
        - MadGraph
        - Geometry
        - Selection
        - DataBase
        - Packaging/CI
        - Dash interfaces
        - Other
