[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "SetAnubis"
version = "1.0.0"
description = "Physics-simulation toolkit for ANUBIS LLP sensitivity studies"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Théo Reymermier"},
  {name = "Paul Swallow"},
]
maintainers = [
  {name = "Théo Reymermier"},
  {name = "Paul Swallow"},
]
keywords = ["physics", "anubis", "llp", "pythia", "hepmc", "madgraph"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "pandas",
  "sympy",
  "matplotlib",
  "scipy",
  "pyyaml",
  "particle",
  "graphviz",
  "awkward",
  "fastjet",
  "docker",
  "watchdog",
  "six",
]

[project.optional-dependencies]
pythia = ["pybind11>=2.12", "pyhepmc"]
selection = ["pyhepmc", "fastjet", "awkward"]
madgraph = ["docker"]
app = ["dash", "plotly", "requests", "python-dotenv", "python-multipart"]
docs = ["sphinx", "sphinx_rtd_theme"]
dev = ["pytest", "pytest-cov", "build", "twine", "ruff", "bandit", "pip-audit", "tomli>=2; python_version < '3.11'"]
all = [
  "pybind11>=2.12", "pyhepmc", "fastjet", "awkward", "docker",
  "dash", "plotly", "requests", "python-dotenv", "python-multipart",
  "sphinx", "sphinx_rtd_theme", "pytest", "pytest-cov", "build", "twine", "ruff", "bandit", "pip-audit",
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/SET-ANUBIS/set-anubis"
Repository = "https://github.com/SET-ANUBIS/set-anubis"
Documentation = "https://set-anubis.github.io/set-anubis/"
Issues = "https://github.com/SET-ANUBIS/set-anubis/issues"
ANUBIS-Proceedings = "https://arxiv.org/abs/2512.14942"
HNL-Sensitivity-Study = "https://arxiv.org/abs/2606.26862"
Citation = "https://github.com/SET-ANUBIS/set-anubis/blob/main/CITATION.cff"

[project.scripts]
setanubis-pythia-check = "SetAnubis.core.Pythia.tools.check_install:main"
setanubis-pythia-smoke = "SetAnubis.examples.Pythia.dev_examples.main_test_pythia_refactor:main"
setanubis-docs = "SetAnubis.tools.docs:main"
setanubis-hepmc-explorer = "SetAnubis.HepMCGUI.app:main"
setanubis-db-dashboard = "SetAnubis.SetAnubisDBDashboard.SetAnubisDBDashboard.app:main"

[tool.setuptools]
package-dir = {"" = "setanubis"}
py-modules = ["setanubis"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["setanubis"]
namespaces = true
exclude = [
  "tests", "tests.*",
  "SetAnubis.core.*.app", "SetAnubis.core.*.app.*",
]

[tool.setuptools.package-data]
"SetAnubis" = ["py.typed", "**/*.yaml", "**/*.yml", "**/*.json", "**/*.dat", "**/*.txt", "**/*.csv", "**/*.gz", "**/*.pkl"]
"SetAnubis.core.Pythia.bindings" = ["*.so", "*.pyd", "*.dylib"]
"SetAnubis.HepMCGUI" = ["assets/*.css", "assets/*.png"]
"SetAnubis.SetAnubisDBDashboard.SetAnubisDBDashboard" = ["assets/*.css", "assets/*.png"]

[tool.setuptools.exclude-package-data]
"SetAnubis" = [
  "core/Pythia/app/scan_cmnd_files*/*",
  "core/Pythia/app/scan_cmnd_files*",
  "core/*/app/*",
  "core/*/app/**/*",
  "**/._*",
  "**/.DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["setanubis/tests"]
pythonpath = ["setanubis"]
markers = [
  "pythia: tests requiring compiled Pythia/HepMC3 binding",
]
filterwarnings = [
  "error::ResourceWarning",
  # SWIG types from optional native dependencies omit __module__ on Python 3.10+.
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]


[tool.ruff]
target-version = "py310"
extend-exclude = [
  "Assets",
  "External_Integration",
  "setanubis/SetAnubis/assets/UFO",
  "setanubis/SetAnubis/core/UFOInterface/SM_NLO",
  "setanubis/SetAnubis/HepMCGUI",
  "setanubis/SetAnubis/SetAnubisDBDashboard",
]

[tool.ruff.lint]
# Release gate: syntax errors, undefined names, and invalid control-flow only.
# Generated UFO trees intentionally retain upstream formatting and imports.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["SetAnubis"]
omit = [
  "*/SetAnubis/assets/*",
  "*/SetAnubis/examples/*",
  "*/SetAnubis/HepMCGUI/*",
  "*/SetAnubis/SetAnubisDBDashboard/*",
  "*/SetAnubis/core/*/app/*",
  "*/SetAnubis/core/UFOInterface/SM_NLO/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 58
